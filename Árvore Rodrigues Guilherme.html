*{box-sizing:border-box}
.wrap{max-width:1120px;margin-inline:auto}

.sub{color:var(--muted);margin:0;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;padding:7px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}

.kids-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
.kids{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;text-align:left;cursor:pointer;border-radius:8px;padding:9px 12px;min-width:0;display:grid;gap:1px;color:var(--ink);background:var(--surface);border:1.5px solid var(--sea)}
.chip b{font-weight:600;font-size:.92rem;line-height:1.25}
.chip small{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.t-line{background:var(--sea);color:var(--sea-ink)} .chip.t-line small{color:var(--sea-ink);opacity:.82}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:1px}
.only-line .t-side,.only-line .parents{display:none}
.only-line .kids-label.side-only{display:none}
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:env(safe-area-inset-top,0px);margin-top:18px;max-height:calc(100vh - 24px);overflow:auto}

}

aside h3{font-family:var(--display);font-size:1.45rem;line-height:1.15;margin:0 0 2px;text-wrap:balance}
.rel{color:var(--sea);font-weight:600;font-size:.85rem;margin:0 0 12px}
.empty{color:var(--muted);margin:0}

.sec{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.src{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin:0 0 6px;overflow-wrap:anywhere}
.src span{color:var(--ink)}

<div class="wrap">
<header>
  <h1>Rodrigues Guilherme</h1>
  <p class="sub">Linha paterna, de Lagos (Luz e Barão de São João) até Lisboa e Setúbal. Cada nome abre a ficha com datas, sítios e a cota do livro onde o assento está.</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="Mostrar">
      <button id="b-all" aria-pressed="true">Toda a família</button>
      <button id="b-line" aria-pressed="false">Só linha directa</button>
    </div>
    <div class="legend">
      <span><i class="k-line"></i>linha Guilherme</span><span><i class="k-anc"></i>cônjuges e antepassados</span><span><i class="k-side"></i>irmãos</span><span><i class="k-flag"></i>falta confirmar</span>
    </div>
  </div>
</header>
<main>
  <div id="tree"></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<section class="open-sec" id="open"></section>
<section class="open-sec" id="refs"></section>
</div>

{t:"António Joaquim de Souza e Anna Joaquina",m:"Casamento antes de Ago 1820 · local por descobrir",h:"ajs",w:"anj",hp:["jscb","mi"],wp:["afl","jmp"],k:["maria20","cat","ant53"]},
{t:"Manoel Rodrigues e Catharina Maria",m:"Casamento a 23 Nov 1852 · Luz",h:"man18",w:"cat",k:["man62","mar70"]},
{t:"Manuel Rodrigues Guilherme e Thereza de Jesus",m:"Data do casamento por confirmar · filhas legitimadas em 1895",h:"man62",w:"thj",k:["leo","lau","man01"]},
{t:"Manuel Rodrigues Guilherme e Rosinda de Jesus",m:"Casamento em Abr 1923",h:"man01",w:"ros",k:["mt25","art","ida","mlu","rog","mmg"]},
{t:"Rogério Rodrigues Guilherme",m:"A família da mãe fica fora desta árvore",h:"rog",w:null,k:["mar"]}
];
const OPEN=[
"Baptismo de Rodrigo de Souza, c. 1750–1770, Albufeira. Só há registos digitalizados desde 1833: é preciso pedir ao Arquivo Distrital de Faro.",
"Casamento de Rodrigo de Souza e Maria da Glória, antes de Abr 1796. Faltam as páginas 16–64 do livro de Barão de São Miguel, as primeiras páginas do livro da Luz (antes de 1776) e as do Barão de São João (antes de 1774).",
"Óbito de Rodrigo de Souza, depois de 1818. Luz e Barão de São João estão revistos de 1802 a 1875 sem resultado. Próximo: Bensafrim.",
"Baptismo de Maria da Glória, c. 1755–1775, provavelmente Barão de São Miguel (Vila do Bispo).",
"Casamento de António Joaquim de Souza e Anna Joaquina. Falta o livro da Luz de 1803–1827; tentar a Mexilhoeira Grande e os duplicados diocesanos.",
"Baptismo de Maria Thereza (Barão de São João, 1785–1800) e de Catharina Maria (Luz).",
"Óbito de Catharina Maria: não consta na Luz até 1905.",
"Casamento de 1923 (assento n.º 74) para fixar o dia, 3 ou 8 de Abril."
];
const $=s=>document.querySelector(s);
const rels={};
F.forEach((f,i)=>{[f.h,f.w].filter(Boolean).forEach(id=>{(rels[id]=rels[id]||{sp:[],kids:[],par:null,sib:[]});});
  f.k.forEach(k=>{(rels[k]=rels[k]||{sp:[],kids:[],par:null,sib:[]}).par=[f.h,f.w].filter(Boolean)});});
F.forEach(f=>{
  if(f.h&&f.w){rels[f.h].sp.push(f.w);rels[f.w].sp.push(f.h);}
  [f.h,f.w].filter(Boolean).forEach(id=>f.k.forEach(k=>{if(!rels[id].kids.includes(k))rels[id].kids.push(k)}));
  f.k.forEach(k=>rels[k].sib=f.k.filter(x=>x!==k));
  [["hp",f.h],["wp",f.w]].forEach(([key,id])=>{if(f[key]&&id){f[key].forEach(p=>{(rels[p]=rels[p]||{sp:[],kids:[],par:null,sib:[]}).kids.push(id)});rels[id].par=f[key]; rels[f[key][0]].sp.push(f[key][1]);rels[f[key][1]].sp.push(f[key][0]);}});
});
const years=p=>{const a=(p.nasc||"").match(/\d{4}/),b=(p.morte||"").match(/\d{4}/);return (a?a[0]:"")+(a||b?"–":"")+(b?b[0]:"")};
function chip(id,cls=""){const p=P[id];const dot=p.flag?'<span class="dot" title="falta confirmar"></span>':"";
  const sub=years(p)||p.d||p.local||"";
  return `<button class="chip t-${p.t} ${cls}" data-id="${id}"><b>${p.n}${dot}</b>${sub?`<small>${sub}</small>`:""}</button>`}
function render(){
  $("#tree").innerHTML=F.map(f=>{
    const line=P[f.h].t==="line";
    const col=(id,par)=>id?`<div class="col">${chip(id)}${par?`<div class="parents">filho(a) de ${par.map(x=>chip(x,"sm")).join('<span>e</span>')}</div>`:""}</div>`:"";
    return `<section class="fam ${line?"has-line":""}"><div><h2>${f.t}</h2><p class="meta">${f.m}</p></div>
      <div class="couple">${col(f.h,f.hp)}${f.w?'<span class="x">×</span>':""}${f.w?col(f.w,f.wp):""}</div>
      <div class="kids-label">Filhos</div><div class="kids">${f.k.map(k=>chip(k)).join("")}</div></section>`}).join("");
  $("#open").innerHTML=`<h2>O que ainda falta</h2><ul>${OPEN.map(o=>`<li>${o}</li>`).join("")}</ul>`;
  $("#refs").innerHTML=index();
}
function link(id){return chip(id,"sm")}
function refs(p){const k=[...new Set(p.src||[])];
  if(!k.length)return `<div class="sec">Fontes</div><p class="src">Ainda sem assento transcrito nesta página.</p>`;
  return `<div class="sec">Fontes</div>`+k.map(x=>{const r=REF[x];return `<div class="ref"><b>${r.t}</b><span>${r.data}</span><span>${r.livro}</span><code>${r.cota}</code><span>${r.loc}</span></div>`}).join("")}
function neg(id){const a=NEG[id];return a?`<div class="sec">Já procurado, sem resultado</div><ul class="notes">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
function index(){const used={};Object.values(P).forEach(p=>(p.src||[]).forEach(k=>{(used[k]=used[k]||[]).push(p.n)}));
  return `<h2>Livros e assentos</h2><p class="hint">Todas as imagens estão no DigitArq do Arquivo Distrital de Faro. Procura pela cota. O número da imagem conta desde a primeira imagem do livro no leitor e pode variar nos livros digitalizados em duplicado.</p>`+
  Object.entries(REF).map(([k,r])=>`<div class="ref"><b>${r.t}</b><span>${r.data}</span><span>${r.livro}</span><code>${r.cota}</code><span>${r.loc}</span><span class="who">${[...new Set(used[k]||[])].join(" · ")}</span></div>`).join("")}
function show(id,scroll){
  const p=P[id],r=rels[id]||{sp:[],kids:[],par:null,sib:[]};
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-current",c.dataset.id===id?"true":"false"));
  const rows=[["Nascimento",p.nasc],["Local",p.local||p.d],["Morte",p.morte]].filter(x=>x[1]);
  const grp=(t,a)=>a&&a.length?`<div class="sec">${t}</div><div class="links">${a.map(link).join("")}</div>`:"";
  $("#panel").innerHTML=`<button class="close" id="x">Fechar</button><h3>${p.n}</h3><p class="rel">${p.rel||(id==="mar"?"Tu":"")}</p>
   ${rows.length?`<dl>${rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`:""}
   ${p.flag?`<p class="flag">${p.flag}</p>`:""}
   ${p.notes.length?`<ul class="notes">${p.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`:""}
   ${grp("Pais",r.par)}${grp(r.sp.length>1?"Cônjuges":"Cônjuge",[...new Set(r.sp)])}${grp("Filhos",[...new Set(r.kids)])}${grp("Irmãos",r.sib)}
   ${refs(p)}${neg(id)}`;
  $("#panel").classList.add("open");
  $("#x").onclick=()=>{$("#panel").classList.remove("open")};
  try{history.replaceState(null,"","#"+id)}catch(e){}
}
render();
$("#panel").innerHTML='<p class="empty">Escolhe um nome para ver a ficha, as datas e onde está o assento.</p>';
document.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c)show(c.dataset.id)});
function mode(line){document.body.classList.toggle("only-line",line);$("#b-all").setAttribute("aria-pressed",!line);$("#b-line").setAttribute("aria-pressed",line)}
$("#b-all").onclick=()=>mode(false);$("#b-line").onclick=()=>mode(true);
const h=location.hash.slice(1);if(h&&P[h])show(h);
</script>
